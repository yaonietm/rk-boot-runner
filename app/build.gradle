plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rk.bootscript'
    compileSdk 33

    defaultConfig {
        applicationId "com.rk.bootscript"
        minSdk 26    // 适配大部分RK安卓8~13工控屏，如果你是安卓7，改成24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
